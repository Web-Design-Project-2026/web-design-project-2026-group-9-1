<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniLOOP search</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/search.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="js/search.js" defer></script>
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a class="image-button btn-home" href="index.html"></a>
      <a class="default-icon-search" href="#"></a>
      <a class="image-button btn-add" href="#"></a>
      <a class="image-button btn-messages" href="#"></a>
      <a class="image-button btn-profile" href="profile.html"></a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- TOP BAR -->
      <div class="topbar">
        <div class="logo"><img src="images/logo.svg" alt="Logo" /></div>
        <div class="points"><p class="captions">0 Points</p></div>
      </div>

      <!-- SEARCH -->
      <div class="search-container">
        <input type="text" placeholder="Search..." />
        <span class="search-icon"><i class="fa-brands fa-sistrix"></i></span>
      </div>

      <!-- SEARCH HISTORY-->
      <h2 class="section-title">Search history</h2>
      <div class="history"></div> 

      <!-- CATEGORIES -->
      <h2 class="section-title">Categories</h2>

      <div class="categories">
        <div class="category">
          <button class="category-button btn-clothes"></button>
          <p class="captions">Clothes</p>
        </div>

        <div class="category">
          <button class="category-button btn-books"></button>
         <p class="captions">Books</p>
        </div>

        <div class="category">
          <button class="category-button btn-patches"></button>
          <p class="captions">Patches</p>
        </div>

        <div class="category">
          <button class="category-button btn-transport"></button>
          <p class="captions">Transports</p>
        </div>

        <div class="category">
          <button class="category-button btn-electronics"></button>
          <p class="captions">Electronics</p>
        </div>

        <div class="category">
          <button class="category-button btn-services"></button>
          <p class="captions">Services</p>
        </div>

        <div class="category">
          <button class="category-button btn-apartaments"></button>
          <p class="captions">Apartaments</p>
        </div>

        <div class="category">
          <button class="category-button btn-furniture"></button>
          <p class="captions">Furniture</p>
        </div>
      </div>

      <!-- HASHTAG -->
      <h2 class="section-title">Popular Hashtags</h2>

        <div class="hashtags_container">

          <button class="engineer_hashtag">
            <p class="captions">#engineer_school</p>
          </button>

          <button class="medicine_hashtag">
            <p class="captions">#medicine_school</p>
          </button>

          <button class="communication_hashtag">
            <p class="captions">#communication_school</p>
          </button>

          <button class="education_hashtag">
            <p class="captions">#education_school</p>
          </button>

          <button class="business_hashtag">
            <p class="captions">#business_school</p>    
          </button>

          <button class="general_hashtag">
            <p class="captions">#books</p>
          </button>

          <button class="general_hashtag">
            <p class="captions">#kick_off</p>
          </button>

          <button class="general_hashtag">
            <p class="captions">#tickets</p>
          </button>

          <button class="general_hashtag">
            <p class="captions">#ovves</p>
          </button>
        </div>
      </div>
      <div class="blank-space"></div>
    </main>
  </body>
</html>
