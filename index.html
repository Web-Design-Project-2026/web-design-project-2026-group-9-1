<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniLOOP home</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css">
    <script src="js/posts_parser.js" defer></script>
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <button class="image-button btn-home"></button>
      <button class="image-button btn-search"></button>
      <button class="image-button btn-add"></button>
      <button class="image-button btn-messages"></button>
      <button class="image-button btn-profile"></button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- TOP BAR -->
      <div class="topbar">
        <div class="logo"><img src="#" alt="Logo" /></div>
        <div class="points"><p class="captions">0 Points</p></div>
      </div>

      <!-- SEARCH -->
      <div class="search-container">
        <input type="text" placeholder="Search..." />
        <span class="search-icon">🔍</span>
      </div>

      <!-- CATEGORIES -->
      <div class="categories">
        <div class="category">
          <button class="category-button btn-clothes"></button>
          <p class="captions">Clothes</p>
        </div>

        <div class="category">
          <button class="category-button btn-books"></button>
         <p class="captions">Books</p>
        </div>

        <div class="category">
          <button class="category-button btn-patches"></button>
          <p class="captions">Patches</p>
        </div>

        <div class="category">
          <button class="category-button btn-transport"></button>
          <p class="captions">Transports</p>
        </div>

        <div class="category">
          <button class="category-button btn-electronics"></button>
          <p class="captions">Electronics</p>
        </div>

        <div class="category">
          <button class="category-button btn-services"></button>
          <p class="captions">Services</p>
        </div>

        <div class="category">
          <button class="category-button btn-apartaments"></button>
          <p class="captions">Apartaments</p>
        </div>

        <div class="category">
          <button class="category-button btn-furniture"></button>
          <p class="captions">Furniture</p>
        </div>
      </div>


      <h2 class="section-title">Recommended for you</h2>

      <!-- GRID -->
      <div class="items-grid">
        <!-- GO TO posts_parser.js TO SEE THIS PART OF CODE -->
      </div>
    </main>
  </body>
</html>
