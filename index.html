<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniLOOP home</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="home">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <button class="image-button btn-home"></button>
      <button class="image-button btn-search"></button>
      <button class="image-button btn-add"></button>
      <button class="image-button btn-messages"></button>
      <button class="image-button btn-profile"></button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- TOP BAR -->
      <div class="topbar">
        <div class="logo"><img src="#" alt="Logo" /></div>
        <div class="points">0 Points</div>
      </div>

      <!-- SEARCH -->
      <div class="search-container">
        <input type="text" placeholder="Search..." />
        <span class="search-icon">🔍</span>
      </div>

      <!-- CATEGORIES -->
      <div class="categories">
        <div class="category">
          <button class="category-button btn-clothes"></button>
          <p>Clothes</p>
        </div>

        <div class="category">
          <button class="category-button btn-books"></button>
          <p>Books</p>
        </div>

        <div class="category">
          <button class="category-button btn-patches"></button>
          <p>Patches</p>
        </div>

        <div class="category">
          <button class="category-button btn-transport"></button>
          <p>Transports</p>
        </div>

        <div class="category">
          <button class="category-button btn-electronics"></button>
          <p>Electronics</p>
        </div>

        <div class="category">
          <button class="category-button btn-services"></button>
          <p>Services</p>
        </div>

        <div class="category">
          <button class="category-button btn-apartaments"></button>
          <p>Apartaments</p>
        </div>

        <div class="category">
          <button class="category-button btn-furniture"></button>
          <p>Furniture</p>
        </div>
      </div>


      <h2 class="section-title">Recommended for you</h2>

      <!-- GRID -->
      <div class="items-grid">
        <!-- ITEM -->
        <div class="item-post">
          <!-- IAMGES NEEDS TO BE CHANGED ENTIRELY -->
          <div class="images">
            <div class="big"></div>
            <div class="small"></div>
            <div class="small"></div>
          </div>

          <div class="user">@student</div>
          <h3>Item Heading</h3>

          <div class="hastages">
            <span>#graphic_design</span>
            <span>#books</span>
          </div>

          <p class="price">500 points</p>

          <div class="actions">
            <button class="buy-button buy-btn"></button>
            <button class="post-button save-button"></button>
            <button class="post-button share-button"></button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
